<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
</head>
<style>
     body {
         background: rgba(26, 193, 193, 0.348);
         font-family: Arial, sans-serif;
         align-items: center;
         text-align: left;
         font-size: large;
         margin: 0;
         padding: 20px;
     }

     .header-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #7c1307;
    color: #ffffff;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}
.logo {
    font-size: 3.25rem;
    font-weight: bold;
}

     #menuToggle {
         display: inline-flex;
         align-items: center;
         justify-content: center;
         gap: 10px;
         background: #007BFF;
         color: #ffffff;
         border:none;
         border-radius: 10px;
         padding: 12px 18px;
         cursor: pointer;
         font-size: 1rem;
     }

     #menuToggle:hover {
         background: #ba2430;
     }

     #menu {
         margin-top: 20px;
         padding: 10px;
         gap: 1px;
         background: #ffffff;
         border-radius: 14px;
         box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
         max-width: 150px;
     }

     .menu-links {
         display: flex;
         flex-direction: column;
         gap: 12px;
     }

     .menu-links a {
         color: #007BFF;
         text-decoration: none;
         font-weight: 600;
     }

     .menu-links a:hover {
         text-decoration: underline;
     }
</style>
<body>
      
    <header class="header-bar">
        <div class="header-brand">
            <span class="logo">StudyHub</span>
            <span class="brand-text">Welcome's You</span>
        </div>
    </header> <br>

    <button id="menuToggle" aria-controls="menu" aria-expanded="false">Menu</button>
    <aside id="menu" hidden>
        <nav class="menu-links">
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('student_login') }}">Student Login</a>
     
        </nav>
    </aside>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menu = document.getElementById('menu');

        menuToggle.addEventListener('click', () => {
            const isHidden = menu.hidden;
            menu.hidden = !isHidden;
            menuToggle.setAttribute('aria-expanded', String(!isHidden));
        });
    </script>
</body>
</html>
